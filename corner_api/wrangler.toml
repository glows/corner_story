name = "corner-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "corner-api.flymind.org"
custom_domain = true

[vars]
BETTER_AUTH_URL = "https://corner-api.flymind.org"
AUTH_TRUSTED_ORIGINS = "http://127.0.0.1:8080,http://localhost:8080,https://corner-api.flymind.org"
ANDROID_SHA256_CERT_FINGERPRINTS = "46:A5:2F:9C:24:91:3E:FA:3C:96:03:D9:5C:E3:AE:FE:6F:AC:D9:29:EA:B3:AE:F9:0A:F7:03:43:4F:F2:E6:3B"

[assets]
directory = "../corner_story/build/web"
binding = "ASSETS"
run_worker_first = true

# 1. Cloudflare D1 (Serverless Edge SQLite)
[[d1_databases]]
binding = "DB"
database_name = "corner-prod-db"
database_id = "e3c3805c-05d9-4ee9-aede-b613148f9c1f"

# 2. Cloudflare KV (Edge Cache for Dispatches & Hot Feeds)
[[kv_namespaces]]
binding = "CACHE"
id = "bb8671b99f564fbcb94c484f9699a684"

# 3. Cloudflare R2 (Zero-Egress Film Photography Object Storage)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "corner-editorial-media"

# 4. Cloudflare Vectorize & Workers AI (Uncomment when deploying to Cloudflare Production)
# [[vectorize]]
# binding = "SPOT_VECTORS"
# index_name = "corner-spots-index"
#
# [ai]
# binding = "AI"
